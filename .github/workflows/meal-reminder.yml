# 식사 알림 스케줄러. Vercel 무료 플랜의 크론은 하루 한 번뿐이라, 15분마다 알림 주소를 이 워크플로가 대신 부른다.
# 저장소 비밀값 CRON_SECRET(= Vercel 환경변수 CRON_SECRET과 같은 값)이 필요하고, 없으면 조용히 건너뛴다.
name: 식사 알림

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 알림 주소 부르기
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET이 없어서 건너뛰었어요 (gh secret set CRON_SECRET)"
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "https://dazzang-five.vercel.app/api/cron/meal-reminder"
